[env]
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
# Core's LAN address in bootstrap/compose.env is unreachable off the LAN; the
# laptop gets there over tailscale.
KOMODO_HOST = "http://tower:9120"

[tools]
"aqua:casey/just" = "1.57.0"
"aqua:FiloSottile/age" = "1.3.1"
"aqua:getsops/sops" = "3.13.3"
"aqua:hadolint/hadolint" = "2.15.1"
"aqua:jqlang/jq" = "1.8.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mikefarah/yq" = "4.53.3"
gh = "latest"
