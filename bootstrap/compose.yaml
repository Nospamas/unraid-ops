# Komodo itself: Core, its database, and Periphery.
#
# Deployed by hand, once, and never reconciled -- Komodo cannot deploy the
# containers it runs inside. It is in git so a rebuild starts from a file
# rather than from memory. See README.md for the order.
#
# Decided by ticket 02, installed by ticket 11.

services:
  # FerretDB-on-Postgres rather than MongoDB. Komodo supports exactly these two;
  # Postgres wins here because the human already runs it and backs it up with
  # pg_dump, and losing this database loses every Komodo resource record.
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0@sha256:2386795ec2aa7ae559304361979f1dc5708d383ee9020ae63dadc2940dfe58f7
    container_name: komodo-postgres
    init: true
    restart: unless-stopped
    labels:
      # Keeps Komodo from stopping its own database on StopAllContainers.
      komodo.skip: ""
    environment:
      POSTGRES_USER: ${KOMODO_DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      # /mnt/cache, not /mnt/user -- the only path in this file that differs.
      # appdata is shareUseCache="only", so both names reach the same files on
      # the nvme, but /mnt/user goes through shfs (FUSE) and a database should
      # not write its WAL through that. Bind mount, not a named volume: those
      # live in docker.img, which unraid users recreate routinely.
      - /mnt/cache/appdata/komodo/postgres/data:/var/lib/postgresql/data

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:2.7.0@sha256:5706414241eb84f0515512c37b46db0f1b1eac9e5ceb7e4c2523211c184b1985
    container_name: komodo-ferretdb
    init: true
    restart: unless-stopped
    depends_on:
      - postgres
    labels:
      komodo.skip: ""
    environment:
      # Credentials are generated URL-safe, so they embed here unencoded.
      FERRETDB_POSTGRESQL_URL: postgres://${KOMODO_DATABASE_USERNAME}:${KOMODO_DATABASE_PASSWORD}@postgres:5432/postgres
    volumes:
      - /mnt/cache/appdata/komodo/ferretdb/state:/state

  core:
    image: ghcr.io/moghtech/komodo-core:2.3.1@sha256:768faad246f19f4c1ddfbb675346a7fe9a5010506d31ed4a21251199387004a2
    container_name: komodo-core
    init: true
    restart: unless-stopped
    depends_on:
      - ferretdb
    ports:
      - 9120:9120
    environment:
      TZ: ${TZ}
      KOMODO_TITLE: ${KOMODO_TITLE}
      KOMODO_HOST: ${KOMODO_HOST}
      KOMODO_DATABASE_ADDRESS: ferretdb:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD}
      KOMODO_PERIPHERY_PUBLIC_KEY: file:/config/keys/periphery.pub
      KOMODO_LOCAL_AUTH: "true"
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD}
      KOMODO_DISABLE_USER_REGISTRATION: "true"
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME}
      KOMODO_JWT_SECRET: ${KOMODO_JWT_SECRET}
      KOMODO_WEBHOOK_SECRET: ${KOMODO_WEBHOOK_SECRET}
      # How often Core re-reads the repo for ResourceSync. Default is 1-hr.
      KOMODO_RESOURCE_POLL_INTERVAL: 5-min
    volumes:
      - /mnt/user/appdata/komodo/keys:/config/keys
      - /mnt/user/appdata/komodo/backups:/backups

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:2.3.1@sha256:637bf3c03a84f04821c902eba12f63e527ea1f781a350489aa34f17f48f36e57
    container_name: komodo-periphery
    init: true
    restart: unless-stopped
    depends_on:
      - core
    environment:
      TZ: ${TZ}
      # v2 reverses the connection: Periphery dials Core, and the two
      # auto-generate a keypair into the shared keys directory. No passkey.
      PERIPHERY_CORE_ADDRESS: ws://core:9120
      PERIPHERY_CONNECT_AS: ${KOMODO_FIRST_SERVER_NAME}
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_ROOT_DIRECTORY: /mnt/user/appdata/komodo
      PERIPHERY_INCLUDE_DISK_MOUNTS: /etc/hostname
      # Ticket 03: every Stack's pre_deploy runs `sops -d`, and sops finds its
      # key here rather than in a HOME it does not have.
      SOPS_AGE_KEY_FILE: /config/age.key
    volumes:
      - /mnt/user/appdata/komodo/keys:/config/keys
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      # Identical inside and outside, or compose path resolution breaks:
      # https://github.com/moghtech/komodo/discussions/180
      - /mnt/user/appdata/komodo:/mnt/user/appdata/komodo
      # Ticket 03: sops is one static binary, bind-mounted rather than baked
      # into a custom image -- which would mean rebuilding the container that
      # runs the deploys.
      - /mnt/user/appdata/komodo/bin/sops:/usr/local/bin/sops:ro
      - /mnt/user/appdata/komodo/age.key:/config/age.key:ro
