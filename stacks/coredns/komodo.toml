[[stack]]
name = "coredns"

[stack.config]
server = "tower"
repo = "Nospamas/unraid-ops"
branch = "main"
run_directory = "stacks/coredns"
project_name = "coredns"
additional_env_files = ["../../common.env"]

# The Corefile is the entire configuration -- CoreDNS holds no runtime state, so
# without this an edit to it would reach the box and change nothing. `restart`,
# not `redeploy`: it arrives through a bind mount and is read at startup.
config_files = [
  { path = "conf/Corefile", requires = "restart" },
]

pre_deploy.command = """
docker network inspect shared >/dev/null 2>&1 || docker network create shared
"""
