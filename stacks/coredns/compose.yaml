# Ticket 17. The workload half of 05's split horizon.

services:
  coredns:
    image: coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    restart: unless-stopped
    # The image's default config path is ./Corefile, and its entrypoint takes
    # no arguments.
    command: -conf /etc/coredns/Corefile
    environment:
      TZ: ${TZ}
    x-host-port: tailscale Split DNS, which configures a resolver by address [17]
    ports:
      # The tailnet address explicitly, never 0.0.0.0 -- this resolver must not
      # answer on rb's LAN. Docker cannot bind it before tailscale0 is up, so a
      # reconcile racing a reboot fails until restart: unless-stopped catches up.
      - "100.126.56.26:53:53/udp"
      - "100.126.56.26:53:53/tcp"
    volumes:
      # Directory, never the file -- docs/conventions.md, 'Tracked files'.
      - ./conf:/etc/coredns:ro
    networks:
      - shared

networks:
  shared:
    external: true
