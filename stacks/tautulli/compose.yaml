# Ticket 35. New service. Reads plex at http://plex:32400 -- a container name on
# `shared`, not the box's address. Its plex token is not a Stack secret: the
# first-run wizard writes it into appdata, which is where service settings live.

services:
  tautulli:
    image: lscr.io/linuxserver/tautulli:v2.17.2-ls239@sha256:5a6501710790b545693de2938bdfd279d52291f986b6f7273716783b2b080cc6
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/tautulli:/config
    networks:
      - shared
    labels:
      caddy: tautulli.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 8181}}"

networks:
  shared:
    external: true
