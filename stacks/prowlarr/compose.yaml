# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.7.0.5723-ls167@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      # Indexer proxy only -- no media binds, as found.
      - ${APPDATA}/prowlarr:/config
    networks:
      - shared
    labels:
      caddy: prowlarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 9696}}"

networks:
  shared:
    external: true
