# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls158@sha256:91844fa2c927ad6ede5630127183cc7868b175f6223e83e6a5da1fffea2aa782
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      # Indexer proxy only -- no media binds, as found.
      - ${APPDATA}/prowlarr:/config
    networks:
      - shared
    labels:
      caddy: prowlarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 9696}}"

networks:
  shared:
    external: true
