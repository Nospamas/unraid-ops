# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      # Indexer proxy only -- no media binds, as found.
      - ${APPDATA}/prowlarr:/config
    networks:
      - shared
    labels:
      caddy: prowlarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 9696}}"

networks:
  shared:
    external: true
