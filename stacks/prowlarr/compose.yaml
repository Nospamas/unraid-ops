# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.1.0.5799-ls170@sha256:2806c9b763810589c42157730d547c293639e55c7610e9f5069314854639ec48
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      # Indexer proxy only -- no media binds, as found.
      - ${APPDATA}/prowlarr:/config
    networks:
      - shared
    labels:
      caddy: prowlarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 9696}}"

networks:
  shared:
    external: true
