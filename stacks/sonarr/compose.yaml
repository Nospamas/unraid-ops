# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: sonarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 8989}}"

networks:
  shared:
    external: true
