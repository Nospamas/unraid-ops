# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320@sha256:24acea2956a0ccb11f103877d9f4f8576600fb34bff34820ed749c2256dab89f
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: sonarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 8989}}"

networks:
  shared:
    external: true
