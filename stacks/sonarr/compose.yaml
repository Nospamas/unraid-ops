# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls323@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: sonarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 8989}}"

networks:
  shared:
    external: true
