# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16.2944-ls298@sha256:2fc9c36769a3f50ab529e7ccc37687d118ab42199b01588573f03b3393cc3223
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}/tv:/tv
      - ${MEDIA}/downloads:/downloads
    # Breaks the rule knowingly; ticket 30 is the repair. Prowlarr addresses
    # sonarr here, and that URL lives in prowlarr's appdata, not in this file.
    # This key and the port go together.
    x-host-port: prowlarr, until [30] repoints it at sonarr on `shared`
    ports:
      - "8989:8989"
    networks:
      - shared
    labels:
      caddy: sonarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 8989}}"

networks:
  shared:
    external: true
