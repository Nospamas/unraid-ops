# Ticket 08. Git owns homepage's own config, not just the container.

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.1.0@sha256:d0aeae2e24387af7267d38c8573692b61e0543aa083c689ad04f32267fe6706a
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
      # Required since v1.0. Homepage rejects any Host header not listed here.
      HOMEPAGE_ALLOWED_HOSTS: home.rbrb.in
    env_file:
      # Written by pre_deploy. Absent on a laptop, where `just lint` runs.
      - path: secrets.env
        required: false
    volumes:
      # Must be writable — homepage seeds missing skeleton files and serves
      # HTTP 500 if it cannot write here.
      - ./config:/app/config
      - ${APPDATA}/homepage/logs:/app/config/logs
      # Ticket 39, for the resources widget alone. It reads mounted container
      # volumes only, so without these its disk figure was the container's own
      # overlay. Read-only: homepage never writes outside /app/config.
      - /mnt/user:/mnt/user:ro
      - /mnt/cache:/mnt/cache:ro
    # Ticket 38, for the gatus widget alone. gatus is host-networked, so it has
    # no name on `shared` to dial. Docker resolves this to the bridge gateway at
    # create time -- unlike the subnet address, nothing here is a literal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared
      - dockerproxy
    labels:
      caddy: home.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  shared:
    external: true
  dockerproxy:
    external: true
