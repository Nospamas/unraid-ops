---
# {{HOMEPAGE_VAR_HOST}} is the box's LAN address, still used by everything the
# repo does not own yet. A migrated service loses it twice over: href becomes
# its https://<name>.rbrb.in hostname (ticket 16) and the widget url becomes
# http://<service>:<port> across the shared network (ticket 21).
#
# `container:` reads state through the dockerproxy Stack, not the socket, and
# names the compose *container* -- Komodo runs each Stack as its own project,
# so a migrated service is <stack>-<service>-1.

- Media:
    - Plex:
        icon: plex.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:32400/web
        description: Media server
        server: tower
        container: plex
        widget:
          type: plex
          url: http://{{HOMEPAGE_VAR_HOST}}:32400
          key: '{{HOMEPAGE_VAR_PLEX_TOKEN}}'
          enableNowPlaying: true
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.rbrb.in
        description: TV
        server: tower
        container: sonarr-sonarr-1
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
          enableQueue: true
    - Radarr:
        icon: radarr.svg
        href: https://radarr.rbrb.in
        description: Movies
        server: tower
        container: radarr-radarr-1
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_KEY}}'
          enableQueue: true
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.rbrb.in
        description: Indexers
        server: tower
        container: prowlarr-prowlarr-1
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:30024
        description: Leech-only, behind the VPN
        server: tower
        container: qbittorrent
        widget:
          type: qbittorrent
          # No credentials: qbittorrent's WebUI bypasses auth for whitelisted
          # subnets, and the shared network is one of them (ticket 08).
          url: http://{{HOMEPAGE_VAR_HOST}}:30024
          enableLeechProgress: true
    - Gluetun:
        icon: gluetun.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:30024
        description: NordVPN tunnel — owns qbittorrent's namespace
        server: tower
        container: gluetun
        # No widget: gluetun's control server is on :8000 inside the container
        # and is not published, so nothing can reach it until the download
        # Stack migrates onto the shared network.

- Books:
    - Calibre:
        icon: calibre.svg
        href: https://calibre.rbrb.in
        description: Library — the desktop GUI, over Caddy
        server: tower
        container: calibre-calibre-1
        # No widget: homepage ships one for calibre-web, which is a different
        # application from the calibre this box runs.
    - LazyLibrarian:
        icon: lazylibrarian.svg
        href: https://lazylibrarian.rbrb.in
        description: Book acquisition
        server: tower
        container: lazylibrarian-lazylibrarian-1
        # No widget: homepage has no lazylibrarian type.

- Infrastructure:
    - Komodo:
        icon: komodo.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:9120
        description: What deploys everything here
        server: tower
        container: komodo-core
    - Unraid:
        icon: unraid.svg
        href: http://{{HOMEPAGE_VAR_HOST}}
        description: The box itself
    - Portainer:
        icon: portainer.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:9000
        description: Being retired — second lifeline until SSH proves itself
        server: tower
        container: PortainerCE
