---
# Every href is an https://<name>.rbrb.in hostname and every widget url is
# http://<service>:<port> across the shared network -- docs/conventions.md,
# 'Addressing' (ticket 26).
#
# `container:` reads state through the dockerproxy Stack, not the socket, and
# names the compose *container* -- Komodo runs each Stack as its own project,
# so a migrated service is <stack>-<service>-1.

- Media:
    - Plex:
        icon: plex.svg
        href: https://plex.rbrb.in
        description: Media server
        server: tower
        # plex-media-server, not plex: the Stack inherited Portainer's project
        # name rather than renaming it (ticket 23).
        container: plex-media-server-plex-1
        widget:
          type: plex
          url: http://plex:32400
          key: '{{HOMEPAGE_VAR_PLEX_TOKEN}}'
          enableNowPlaying: true
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.rbrb.in
        description: TV
        server: tower
        container: sonarr-sonarr-1
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
          enableQueue: true
    - Radarr:
        icon: radarr.svg
        href: https://radarr.rbrb.in
        description: Movies
        server: tower
        container: radarr-radarr-1
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_KEY}}'
          enableQueue: true
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.rbrb.in
        description: Indexers
        server: tower
        container: prowlarr-prowlarr-1
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'

- Downloads:
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbittorrent.rbrb.in
        description: Leech-only, behind the VPN
        server: tower
        # qbittorrent, not download: the Stack inherited Portainer's project
        # name rather than renaming it (ticket 24).
        container: qbittorrent-qbittorrent-1
        widget:
          type: qbittorrent
          # No credentials: qbittorrent's WebUI bypasses auth for whitelisted
          # subnets, and the shared network is one of them (ticket 08). The
          # host is gluetun -- qbittorrent has no address of its own.
          url: http://gluetun:30024
          enableLeechProgress: true
    - Gluetun:
        icon: gluetun.svg
        href: https://qbittorrent.rbrb.in
        description: NordVPN tunnel — owns qbittorrent's namespace
        server: tower
        container: qbittorrent-gluetun-1
        widget:
          type: gluetun
          # The control server, reachable at last now that gluetun is on
          # `shared` (ticket 24). Unauthenticated by gluetun's own default.
          url: http://gluetun:8000

- Books:
    - Calibre:
        icon: calibre.svg
        href: https://calibre.rbrb.in
        description: Library — the desktop GUI, over Caddy
        server: tower
        container: calibre-calibre-1
        # No widget: homepage ships one for calibre-web, which is a different
        # application from the calibre this box runs.
    - LazyLibrarian:
        icon: lazylibrarian.svg
        href: https://lazylibrarian.rbrb.in
        description: Book acquisition
        server: tower
        container: lazylibrarian-lazylibrarian-1
        # No widget: homepage has no lazylibrarian type.

- Infrastructure:
    - Komodo:
        icon: komodo.svg
        href: https://komodo.rbrb.in
        description: What deploys everything here
        server: tower
        container: komodo-core
    - Unraid:
        icon: unraid.svg
        href: https://unraid.rbrb.in
        description: The box itself
