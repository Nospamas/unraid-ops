---
# Every href is an https://<name>.rbrb.in hostname and every widget url is
# http://<service>:<port> across the shared network -- docs/conventions.md,
# 'Addressing' (ticket 26).
#
# `container:` reads state through the dockerproxy Stack, not the socket, and
# names the compose *container* -- Komodo runs each Stack as its own project,
# so a migrated service is <stack>-<service>-1.
#
# Groups are cut by use vs machinery, not by subject (ticket 39): what you open
# is separated from what feeds it. settings.yaml holds the matching layout, and
# the two must agree by name or the group renders unstyled.

- Watch & Read:
    - Plex:
        icon: plex.svg
        href: https://plex.rbrb.in
        description: Media server
        server: tower
        # plex-media-server, not plex: the Stack inherited Portainer's project
        # name rather than renaming it (ticket 23).
        container: plex-media-server-plex-1
        widget:
          type: plex
          url: http://plex:32400
          key: '{{HOMEPAGE_VAR_PLEX_TOKEN}}'
          enableNowPlaying: true
    - Tautulli:
        icon: tautulli.svg
        href: https://tautulli.rbrb.in
        description: Plex activity and history
        server: tower
        container: tautulli-tautulli-1
        widget:
          type: tautulli
          url: http://tautulli:8181
          key: '{{HOMEPAGE_VAR_TAUTULLI_KEY}}'
          enableUser: true
          showEpisodeNumber: true
    - Calibre:
        icon: calibre.svg
        href: https://calibre.rbrb.in
        description: Library — the desktop GUI, over Caddy
        server: tower
        container: calibre-calibre-1
        # No widget: homepage ships one for calibre-web, which is a different
        # application from the calibre this box runs.
    - Audiobookshelf:
        icon: audiobookshelf.svg
        href: https://audiobookshelf.rbrb.in
        description: Podcasts — and audiobooks, once there are any
        server: tower
        container: audiobookshelf-audiobookshelf-1
        widget:
          type: audiobookshelf
          url: http://audiobookshelf:80
          # Issued from config → users → the admin account, which does not
          # exist until rb runs the first-boot wizard. Errors until then, and
          # that is [50]'s list rather than a second bug (ticket 47).
          key: '{{HOMEPAGE_VAR_AUDIOBOOKSHELF_KEY}}'

- Acquire:
    - Sonarr:
        icon: sonarr.svg
        href: https://sonarr.rbrb.in
        description: TV
        server: tower
        container: sonarr-sonarr-1
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: '{{HOMEPAGE_VAR_SONARR_KEY}}'
          enableQueue: true
    - Radarr:
        icon: radarr.svg
        href: https://radarr.rbrb.in
        description: Movies
        server: tower
        container: radarr-radarr-1
        widget:
          type: radarr
          url: http://radarr:7878
          key: '{{HOMEPAGE_VAR_RADARR_KEY}}'
          enableQueue: true
    - Bazarr:
        icon: bazarr.svg
        href: https://bazarr.rbrb.in
        description: Subtitles
        server: tower
        container: bazarr-bazarr-1
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: '{{HOMEPAGE_VAR_BAZARR_KEY}}'
    - Prowlarr:
        icon: prowlarr.svg
        href: https://prowlarr.rbrb.in
        description: Indexers
        server: tower
        container: prowlarr-prowlarr-1
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: '{{HOMEPAGE_VAR_PROWLARR_KEY}}'
    - LazyLibrarian:
        icon: lazylibrarian.svg
        href: https://lazylibrarian.rbrb.in
        description: Book acquisition
        server: tower
        container: lazylibrarian-lazylibrarian-1
        # No widget: homepage has no lazylibrarian type.

- Transport:
    - qBittorrent:
        icon: qbittorrent.svg
        href: https://qbittorrent.rbrb.in
        description: Leech-only, behind the VPN
        server: tower
        # qbittorrent, not download: the Stack inherited Portainer's project
        # name rather than renaming it (ticket 24).
        container: qbittorrent-qbittorrent-1
        widget:
          type: qbittorrent
          # No credentials: qbittorrent's WebUI bypasses auth for whitelisted
          # subnets, and the shared network is one of them (ticket 08). The
          # host is gluetun -- qbittorrent has no address of its own.
          url: http://gluetun:30024
          enableLeechProgress: true
    - Gluetun:
        icon: gluetun.svg
        href: https://qbittorrent.rbrb.in
        description: NordVPN tunnel — owns qbittorrent's namespace
        server: tower
        container: qbittorrent-gluetun-1
        widget:
          type: gluetun
          # The control server, reachable at last now that gluetun is on
          # `shared` (ticket 24). Unauthenticated by gluetun's own default.
          url: http://gluetun:8000
    - Unpackerr:
        # .png, not .svg: dashboard-icons has no svg for this one, and the
        # default when a name does not resolve is a blank tile.
        icon: unpackerr.png
        href: https://unpackerr.rbrb.in
        description: Extracts rar'd releases in the download share
        server: tower
        container: unpackerr-unpackerr-1
        # No widget: 48 expected one, and homepage has no unpackerr type among
        # its 166 -- the same shape as calibre and lazylibrarian above.

- Infrastructure:
    - Komodo:
        icon: komodo.svg
        href: https://komodo.rbrb.in
        description: What deploys everything here
        server: tower
        container: komodo-core
    - Gatus:
        icon: gatus.svg
        # status.rbrb.in, not gatus.rbrb.in: gatus is host-networked, so it
        # carries no discoverable caddy label and is served from the Caddyfile
        # (ticket 29).
        href: https://status.rbrb.in
        description: Whether every probe passes
        server: tower
        container: gatus-gatus-1
        widget:
          type: gatus
          # The one widget not on `shared` -- host networking means gatus has no
          # container name to dial. host.docker.internal is docker's own name
          # for the box, declared in compose; the box's LAN IP is a DHCP lease
          # git cannot own (ticket 26).
          url: http://host.docker.internal:8090
    - ntfy:
        icon: ntfy.svg
        # The browser door. :8095 is the alert path for publishers and the
        # phone, and must not be dialled through anything (ticket 29).
        href: https://ntfy.rbrb.in
        description: Where alerts land
        server: tower
        container: ntfy-ntfy-1
        widget:
          type: ntfy
          url: http://ntfy:80
          # The topic gatus and Komodo publish to.
          topic: tower
          # No credentials: no ntfy accounts exist, and the tailnet is the
          # trust boundary (ticket 29).
    - Unraid:
        icon: unraid.svg
        href: https://unraid.rbrb.in
        description: The box itself
