# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
#
# Ticket 46. THIS FILE IS THE OWNERSHIP BOUNDARY -- recyclarr writes only what
# is listed here, and reverts a UI edit to any of it on the next sync, silently.
#
#   owned  quality profiles, custom formats and their scores, quality
#          definitions (the size limits), and propers_and_repacks
#   not    media naming, indexers, root folders, download clients -- absent on
#          purpose. Both apps' naming schemes are hand-set to TRaSH's and
#          renaming is ON, so a silent revert there would reach files on disk.
#
# Profiles carried over from home-ops, where they were picked and verified
# against the TRaSH-Guides JSON directly. The shape is "2160p preferred, 1080p
# fallback", and it excludes remux by design: Remux-2160p averages 61.3 GB
# against ~27 GB for a Bluray-2160p encode.
#
# Specifying a profile by trash_id imports the guide's whole custom-format set
# *and* its score set. The custom_formats blocks below are overrides on top of
# that import, not the complete list.
#
# Each override makes the sync log `has conflicting scores ... (first value
# wins)`. That is recyclarr narrating the shadowing, not a failure: assign_scores_to
# outranks the score set, so the value below is the one that lands [56].

sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env_var SONARR_API_KEY

    # reset_unmatched_scores only zeroes scores; this removes the format.
    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: series

    quality_profiles:
      # WEB 2160p -> WEB 1080p. minFormatScore 0, cutoff WEB 2160p.
      - trash_id: &web-2160p c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # Both carry a required, negated `Not 2160p` spec, so they cannot fire on
      # 4K. Softened from the guide's -10000 to deprioritise rather than reject
      # x265 at the 1080p fallback tier.
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb # x265 (HD)
          - 9b64dff695c2115facf1b6ea59c9bd07 # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *web-2160p
            score: -100

      - trash_ids:
          - 15a05bc7c1a36e2b57fd628f8977e2fc # AV1
        assign_scores_to:
          - trash_id: *web-2160p
            score: -200

      # No score: guide default.
      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64 # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03 # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458 # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140 # Retags
        assign_scores_to:
          - trash_id: *web-2160p

radarr:
  radarr:
    base_url: http://radarr:7878
    api_key: !env_var RADARR_API_KEY

    delete_old_custom_formats: true

    media_management:
      propers_and_repacks: do_not_prefer

    quality_definition:
      type: sqp-uhd

    quality_profiles:
      # Bluray-2160p -> WEB 2160p -> Bluray|WEB-1080p -> Bluray-720p.
      # minFormatScore 1000, satisfied by the imported sqp-1-2160p score set.
      - trash_id: &sqp-1-2160p 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # The sqp-1-2160p score set gives this -10000, which is deliberate in the
      # guide and wrong here: real 4K HDR is inherently 10-bit and the encode
      # groups this profile exists to find advertise it.
      - trash_ids:
          - a5d148168c4506b55cf53984107c396e # 10bit
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: 0

      - trash_ids:
          - dc98083864ea246d05a42df0d05f81cc # x265 (HD)
          - 839bea857ed2c0a8e084f3cbdbd65ecb # x265 (no HDR/DV)
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: -100

      - trash_ids:
          - cae4ca30163749b891686f95532519bd # AV1
        assign_scores_to:
          - trash_id: *sqp-1-2160p
            score: -200

      # No score: guide default.
      - trash_ids:
          - 957d0f44b592285f26449575e8b1167e # Special Edition
          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
          - cc444569854e9de0b084ab2b8b1532b2 # Black and White Editions
          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - trash_id: *sqp-1-2160p
