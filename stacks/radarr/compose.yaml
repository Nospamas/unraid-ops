# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls327@sha256:7a20f20de63706eee2ff6e4ac1f989a70c961f456aa47ccb6c78f2bb7657d9ae
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: radarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 7878}}"

networks:
  shared:
    external: true
