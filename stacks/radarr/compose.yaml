# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: radarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 7878}}"

networks:
  shared:
    external: true
