# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls325@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: radarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 7878}}"

networks:
  shared:
    external: true
