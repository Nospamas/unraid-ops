# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328@sha256:044788f5508b7f67a3e0368cdd142c77c4d4cd5aec2efaba53e1a68b6b6231e7
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}/movies:/movies
      - ${MEDIA}/downloads:/downloads
    networks:
      - shared
    labels:
      caddy: radarr.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 7878}}"

networks:
  shared:
    external: true
