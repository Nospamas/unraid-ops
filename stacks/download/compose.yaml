# Ticket 24. Adopted in place from Portainer's `qbittorrent` project -- both
# Services at once, because qbittorrent runs inside gluetun's network namespace
# and recreating gluetun alone would leave it there with no route and no error
# (ticket 06).
#
# Leech-only is settled, not a defect: NordVPN forwards no port, so nothing
# reaches qbittorrent from the outside. Do not buy port forwarding to "fix" it.

services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      SERVER_COUNTRIES: United States
      SERVER_CITIES: Seattle
      # Pinned to one server on purpose: the trackers we use bind a session to
      # the exit IP, so this may not float across Seattle (ticket 06). The pin
      # must therefore be replaced by hand when NordVPN retires the server --
      # which is what happened to us8240.nordvpn.com on 2026-08-04, and it fails
      # silently, wireguard dialling a dead endpoint with only the healthcheck's
      # DNS timeouts to show for it.
      #
      # Replacing it: the server must be P2P (`legacy_p2p` in NordVPN's API)
      # and must exist in gluetun's list. UPDATER_PERIOD below keeps that list
      # current, so any live Seattle P2P server is a valid pin. Without it
      # gluetun falls back to a bundle stamped March 2024 -- not a stale image,
      # v3.41.3 is current -- which can only name pre-2024 hardware (ticket 06).
      SERVER_HOSTNAMES: us13886.nordvpn.com
      # Refreshes servers.json from NordVPN's API. It cannot rescue a pin that
      # is already dead: it never runs at startup, and it needs the tunnel up to
      # reach the API. What it buys is the next retirement failing loudly --
      # with the list current, gluetun refuses an unknown hostname rather than
      # dialling a corpse in silence, which is how us8240 cost 34 hours.
      UPDATER_PERIOD: 24h
      # FIREWALL_OUTBOUND_SUBNETS is deliberately unset -- empty is gluetun's
      # default and it is the kill switch. What this replaces carried
      # FIREWALL_OUTBOUND_SUBNET=0.0.0.0/0 and FIREWALL_VPN_INPUT_ALLOW=
      # 192.168.1.0, both misspelled and both therefore inert; spelling either
      # correctly would route every packet around the tunnel (ticket 24).
    env_file:
      # WIREGUARD_PRIVATE_KEY. Written by pre_deploy.
      - path: secrets.env
        required: false
    volumes:
      - ${APPDATA}/gluetun:/gluetun
    # Breaks the rule knowingly, and ticket 30 is the repair: the four *arr
    # still address qbittorrent here rather than at gluetun:30024 on `shared`,
    # and that URL lives in their appdata. This key and the port go together.
    x-host-port: the four *arr, until [30] repoints them at gluetun on `shared`
    ports:
      # 6881, the torrent port, is not published: peers arrive through the
      # tunnel, and rb's router forwards nothing to it (ticket 24).
      - "30024:30024"
    networks:
      - shared
    labels:
      # qbittorrent's routing lives here -- a container in another container's
      # namespace has no network identity of its own.
      caddy: qbittorrent.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 30024}}"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2-r4-ls426@sha256:7034f73a3c6fa4ea40fd67df462939d1665d765231b572523921c98c2db5362e
    restart: unless-stopped
    # gluetun owns the namespace, so this Service declares no network, no port
    # and no label of its own. `service:`, not `container:`, cannot cross
    # compose projects -- which is why these two are one Stack (ticket 07).
    network_mode: service:gluetun
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
      WEBUI_PORT: 30024
      TORRENTING_PORT: 6881
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}/downloads:/downloads

networks:
  shared:
    external: true
