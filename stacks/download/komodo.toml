[[stack]]
name = "download"

[stack.config]
server = "tower"
repo = "Nospamas/unraid-ops"
branch = "main"
run_directory = "stacks/download"
# Portainer's project, taken over in place -- ticket 23. The Stack is named
# `download`; the project both containers carry is `qbittorrent`, and renaming
# it would build a second gluetun beside the running one.
project_name = "qbittorrent"
additional_env_files = ["../../common.env"]

pre_deploy.command = """
docker network inspect shared >/dev/null 2>&1 || docker network create shared
(umask 077; sops -d secrets.sops.env > secrets.env)
"""
