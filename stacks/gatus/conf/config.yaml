# Ticket 29. Liveness probes for every fronted service.
#
# The probes go through Caddy on purpose. All three silent failures this map has
# seen were containers that stayed `Up` while serving nothing [16, 21], which is
# invisible to Komodo's StackStateChange -- a mix of container states is what
# that alerts on, and there was no mix. Only an end-to-end request sees it.
#
# Two failure signatures worth recognising:
#   404 -- Caddy discarded the service's block. The `*.rbrb.in` wildcard catches
#          the request and answers "no service by that name". This is [16].
#   502 -- Caddy has the block but cannot reach the container. This is [21].
# Both are why the conditions below assert an exact status rather than `< 400`.
#
# Every status here was measured against the running box, not assumed. Six of
# the ten are not 200.
#
# `ignore-redirect: true` on every HTTP probe, because gatus follows redirects
# by default and five of these then reported the login page's 200 instead of
# the service's own 302 or 303. There is no global default for it -- gatus reads
# `client` only under `endpoints[]` -- so it is repeated rather than shared.

web:
  # Reachable without Caddy, which is the whole point of [26]'s rule that the
  # tooling reporting on the proxy must not sit behind it.
  address: 0.0.0.0
  port: 8090

storage:
  type: sqlite
  path: /data/gatus.db
  caching: true

ui:
  title: Status | tower
  header: tower

alerting:
  ntfy:
    url: http://100.126.56.26:8095
    topic: tower
    # 4 is ntfy's "high". 3 is its default and reads as chatter on a phone.
    priority: 4
    default-alert:
      enabled: true
      # ~3 minutes of sustained failure. A reconcile that legitimately redeploys
      # a Stack takes it down for seconds, and paging on that is how a channel
      # gets muted. Short blips are still visible in the history below [29].
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  - name: homepage
    group: services
    url: https://home.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy

  - name: sonarr
    group: services
    url: https://sonarr.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    # Redirects to its login page unauthenticated. 302 is the healthy answer.
    conditions:
      - '[STATUS] == 302'
    alerts:
      - type: ntfy

  - name: radarr
    group: services
    url: https://radarr.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 302'
    alerts:
      - type: ntfy

  - name: prowlarr
    group: services
    url: https://prowlarr.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 302'
    alerts:
      - type: ntfy

  - name: lazylibrarian
    group: services
    url: https://lazylibrarian.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 303'
    alerts:
      - type: ntfy

  - name: calibre
    group: services
    url: https://calibre.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    # 401 is the GUI password prompt [22] -- the service answering, not a fault.
    conditions:
      - '[STATUS] == 401'
    alerts:
      - type: ntfy

  - name: plex
    group: services
    url: https://plex.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    # Plex account auth. This probe covers the internal path only; plex's own
    # :32400 from the internet is [31]'s question, not this file's.
    conditions:
      - '[STATUS] == 401'
    alerts:
      - type: ntfy

  - name: tautulli
    group: services
    # The one probe not on `/`, deliberately [35]. Tautulli's root answers 303
    # to /welcome until its setup wizard is done, then 200 or a 302 to
    # /auth/login depending on whether a password is set -- a status that moves
    # under a setting in appdata is not something to assert. `/status` is its
    # healthcheck endpoint: unauthenticated, 200 either side of the wizard.
    url: https://tautulli.rbrb.in/status
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].result == success'
    alerts:
      - type: ntfy

  - name: bazarr
    group: services
    # Not `/`, for tautulli's reason [35]: bazarr's root is a 200 only while its
    # UI auth is off, and that switch lives in appdata. `/api/system/ping` is the
    # one API route that takes no key -- 200 either side of the setting -- while
    # /api/system/status next to it answers 401. `/health` and `/ping` look like
    # candidates and are not: both fall through to the SPA catch-all, so they
    # answer 200 with the app's HTML shell whatever the backend is doing.
    url: https://bazarr.rbrb.in/api/system/ping
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].status == OK'
    alerts:
      - type: ntfy

  - name: audiobookshelf
    group: services
    # `/` is a 200 here whatever the backend is doing -- it is the Nuxt shell,
    # and it renders the first-boot wizard and a logged-out login form alike, so
    # it asserts nothing [35, 36]. `/ping` is registered in Server.js above the
    # static handler and outside the `/api` auth middleware, so it is the
    # backend answering and it does not move with a setting. `/healthcheck` is
    # beside it and would do, but it is a bare 200 with no body to check.
    url: https://audiobookshelf.rbrb.in/ping
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].success == true'
    alerts:
      - type: ntfy

  - name: qbittorrent
    group: services
    url: https://qbittorrent.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    # The one probe that would catch [06]'s hazard: recreating gluetun alone
    # leaves qbittorrent in a dead namespace with no route and no error.
    # It does not see a dead tunnel -- served inside the namespace, it answered
    # 200 throughout the us8240 outage -- which is what the vpn- probes cover.
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy

  # On 127.0.0.1 because this Stack is host-networked and the tunnel's
  # namespace is otherwise invisible to it [06].
  - name: vpn-tunnel
    group: infrastructure
    # gluetun's own healthcheck, which dials out through the tunnel -- the
    # general-connectivity probe.
    url: http://127.0.0.1:30025/
    interval: 60s
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy

  - name: vpn-exit-ip
    group: infrastructure
    # The trackers bind to this address, so a change is an outage even while
    # traffic flows; move the literal with the pin (ticket 06).
    url: http://127.0.0.1:30026/v1/publicip/ip
    interval: 60s
    conditions:
      - '[STATUS] == 200'
      - '[BODY].public_ip == 187.15.91.66'
    alerts:
      - type: ntfy

  - name: qbittorrent-bound-to-tunnel
    group: infrastructure
    # Reads empty when libtorrent is bound to eth0 rather than tun0, which
    # gluetun destroys on every VPN restart (ticket 06).
    url: http://127.0.0.1:30024/api/v2/transfer/info
    interval: 60s
    conditions:
      - '[STATUS] == 200'
      - '[BODY].last_external_address_v4 == 187.15.91.66'
    alerts:
      - type: ntfy

  - name: komodo
    group: infrastructure
    url: https://komodo.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
    alerts:
      - type: ntfy

  - name: unraid
    group: infrastructure
    url: https://unraid.rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 302'
    alerts:
      - type: ntfy

  # ntfy's **browser** door, and the only thing watching it [44]. home-ops
  # probes ntfy at `:8095/v1/health`, which is the other door -- so a Caddy
  # block discarded for ntfy alone (the 404 of [16]) leaves the phone and the
  # publishers working and nothing noticing until someone opens a browser.
  #
  # This probe can page about itself, unlike most of the alert path: the case it
  # catches is Caddy losing the route while ntfy is up, so the alert delivers
  # over `:8095`. The case where it cannot -- ntfy itself down -- is home-ops's,
  # by design [29].
  - name: ntfy
    group: infrastructure
    url: https://ntfy.rbrb.in/v1/health
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].healthy == true'
    alerts:
      - type: ntfy

  # Ticket 29's box-down half, mirroring what home-ops already runs against
  # tower. Each site alerts to its **own** ntfy and only ever *reads* the
  # other's, so there is no cross-site credential here and must never be one --
  # an alert about home-ops being down would otherwise be published to the
  # server that is down.
  #
  # Longer thresholds than everything above: these cross the open internet,
  # where a transient WAN blip is not home-ops dying. 2m x 5 (~10 min) matches
  # what home-ops uses probing tower.
  #
  # Names, not literal IPs, unlike every other non-rbrb.in address in this file
  # -- these devices are created by the Tailscale Kubernetes operator and are
  # recreated with fresh addresses. The Corefile forwards the zone for them.
  - name: home-ops ntfy
    group: home-ops
    # HTTP on port 80, not HTTPS -- nothing listens on 443. Deliberate on that
    # side: tailscale is the trust boundary and there is no auth.
    url: http://ntfy.gute-morpho.ts.net/v1/health
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].healthy == true'
    alerts: &home-ops-alert
      - type: ntfy
        failure-threshold: 5
        success-threshold: 3
        send-on-resolved: true

  - name: home-ops gatus
    group: home-ops
    url: http://home-ops-gatus.gute-morpho.ts.net/health
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].status == UP'
    alerts: *home-ops-alert

  # The same gatus as above, reached the long way round -- Cloudflare, the
  # Tunnel, envoy. Deliberately a *different question*, and the pair localises
  # the fault in a way neither does alone:
  #
  #   both fail          home-ops or its WAN link is down
  #   this alone fails   the cluster is fine; Cloudflare or the Tunnel is broken
  #   this alone passes  home-ops is fine; *tower's* tailnet path is broken
  #
  # That third row is why it earns its place: it stops a DERP or WAN blip on
  # this side reading as "home-ops is down".
  #
  # Same group as the two above, so the status page reads as one site. That
  # costs the table nothing: a group is display only, and what separates this
  # from the tailnet probes is its own alert below -- its own threshold and its
  # own wording, fired independently of theirs.
  #
  # Longer again than the tailnet probes -- two more third parties in the path,
  # each with legitimate reasons to blip that are nobody's fault. 2m x 10.
  - name: home-ops via cloudflare
    group: home-ops
    url: https://status.xgy.im/health
    interval: 2m
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 200'
      - '[BODY].status == UP'
    alerts:
      - type: ntfy
        # Worded away from "home-ops is down" on purpose: the tailnet probes
        # answer that question, and these two need different responses.
        description: home-ops is not reachable from the internet -- suspect Cloudflare or the Tunnel, not the cluster
        failure-threshold: 10
        success-threshold: 3
        send-on-resolved: true

  # No ICMP probe, though the hand-off suggested one -- home-ops cannot do it in
  # its direction and tower can, in principle, since tailscale runs on the host.
  # It does not: `net.ipv4.ping_group_range` is `1 0` on this box, an empty
  # range, so 99:100 cannot open an unprivileged ICMP socket. Widening it is
  # host state for one redundant signal [26]; the two probes above already fail
  # together if the path is down.

  # A route, not a service, so it sits with the infrastructure rather than the
  # things it points at. It has a failure nothing else here would see: the apex
  # is outside the wildcard cert [37], so its own issuance can fail while every
  # `*.rbrb.in` probe above stays green. `ignore-redirect` is what makes the
  # 308 assertable -- following it would report homepage's 200 and the front
  # door could break without this noticing.
  - name: bare domain
    group: infrastructure
    url: https://rbrb.in/
    interval: 60s
    client:
      ignore-redirect: true
    conditions:
      - '[STATUS] == 308'
    alerts:
      - type: ntfy

  - name: coredns
    group: infrastructure
    # The only end-to-end test of the split horizon [17, 18]. Asking CoreDNS
    # directly for a name whose public answer is different is what makes this
    # meaningful: 192.168.1.195 is the Cloudflare record, so an answer of
    # 100.126.56.26 proves the tailnet view specifically.
    url: 100.126.56.26
    dns:
      query-name: sonarr.rbrb.in
      query-type: A
    interval: 60s
    conditions:
      - '[DNS_RCODE] == NOERROR'
      - '[BODY] == 100.126.56.26'
    alerts:
      - type: ntfy
