[[stack]]
name = "gatus"

[stack.config]
server = "tower"
repo = "Nospamas/unraid-ops"
branch = "main"
run_directory = "stacks/gatus"
project_name = "gatus"
additional_env_files = ["../../common.env"]

# The probe list is the whole configuration and git owns it, so without this an
# edit to it would reach the box and change nothing -- the loop tracks only the
# compose file. `restart`, not `redeploy`: it arrives through a bind mount.
config_files = [
  { path = "conf/config.yaml", requires = "restart" },
]

# gatus runs as 99:100 and writes its sqlite database here; docker would
# otherwise create the target root:root [11].
pre_deploy.command = """
docker network inspect shared >/dev/null 2>&1 || docker network create shared
mkdir -p /mnt/user/appdata/gatus
chown 99:100 /mnt/user/appdata/gatus
"""
