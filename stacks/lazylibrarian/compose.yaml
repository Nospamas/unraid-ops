# Ticket 21. Adopted off unraid's Docker tab; the appdata is unchanged.

services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:ef1f6e73-ls222@sha256:05515b7c4485fc4816679a60a97c794e27c0c4ceab788c58ae003461be7a158a
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
      TZ: ${TZ}
      # Carried over as found -- calibredb is how it imports into the library
      # calibre serves.
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - ${APPDATA}/lazylibrarian:/config
      - ${MEDIA}/books:/books
      - ${MEDIA}/downloads:/downloads
    # The only host port in the repo with no reader at all -- kept as found by
    # ticket 21, and nothing has ever addressed it. It is not a carve-out, it is
    # a leftover, and ticket 30 deletes it with the other four.
    x-host-port: nobody. Unjustified; delete with the port in [30]
    ports:
      - "5299:5299"
    networks:
      - shared
    labels:
      caddy: lazylibrarian.rbrb.in
      caddy.import: internal
      caddy.reverse_proxy: "{{upstreams 5299}}"

networks:
  shared:
    external: true
