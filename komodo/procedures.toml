# The reconcile loop. Poll, not webhook — nothing inbound reaches the box yet
# (ticket 02).

[[procedure]]
name = "reconcile"
description = "Sync resources from git, then deploy the Stacks that changed"

[procedure.config]
schedule_format = "Cron"
# Six fields — seconds are required, so the hour is the *third*: a `3` in
# the first slot is second 3 of every hour, not 3am [57].
schedule = "0 0 3 * * ?"
schedule_enabled = true
schedule_timezone = "America/Vancouver"
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Sync resources"
executions = [
  { execution.type = "RunSync", execution.params.sync = "unraid-ops" },
]

[[procedure.config.stage]]
name = "Deploy changed stacks"
executions = [
  # Never "*": an adopted-but-never-deployed Stack has no deployed contents to
  # diff, which DeployStackIfChanged reads as "deploy it" — recreating the
  # gluetun/qbittorrent pair unattended (ticket 06). Extend as each migrates.
  # ntfy precedes gatus deliberately: gatus publishes to it, and the Caddy
  # entry for status.rbrb.in is useless until gatus is up (ticket 29).
  { execution.type = "BatchDeployStackIfChanged", execution.params.pattern = "dockerproxy, homepage, caddy, coredns, sonarr, radarr, prowlarr, lazylibrarian, calibre, plex, download, ntfy, gatus, tautulli, bazarr, recyclarr, audiobookshelf, unpackerr" },
]
